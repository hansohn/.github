---
name: 💬 Support Request
description: Request support with this project
title: "[Support]: "
labels: [question]
assignees:
  - hansohn

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this support request!

  - type: textarea
    id: question
    attributes:
      label: How can we help you?
      description: Ask anything you can think of, we're here to help.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about your question here.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: >-
        By submitting this issue, you agree to follow our
        [Code of Conduct](https://github.com/hansohn/.github/blob/HEAD/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
